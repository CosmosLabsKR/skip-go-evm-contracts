[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true

# solc embeds `settings.remappings` in the metadata blob appended to every contract's bytecode. With auto-detection
# on, foundry derives part of that list by scanning lib/, so a nested dependency directory merely EXISTING on the
# build machine changes the deployed bytecode — and with it the source-verification match. Pinning to remappings.txt
# makes the build reproducible from tracked files alone. (ds-test is listed there explicitly because auto-detection
# used to supply it.) ForwarderFactory sets this too, where the same effect additionally moved CREATE2 addresses.
auto_detect_remappings = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
