[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
# ⚠️ Every SETTING below is byte-for-byte the same as ForwarderFactory/foundry.toml, and must stay that way — see
# `make check-transit-copies`, which compares the settings (not the comments, which necessarily differ because this
# subproject targets a different chain).
#
# cancun (not shanghai) since the openzeppelin-contracts v5.6.1 bump: Strings.sol -> Bytes.sol uses `mcopy`, which
# solc refuses to emit for shanghai. paris is out for a second reason: PUSH0 is emitted from shanghai onward, and
# calls into PUSH0 bytecode fail with NotActivated on a paris target.
#
# TARGET CHAINS ARE AVALANCHE C-CHAIN AND POLYGON PoS, not Injective EVM. cancun availability was PROBED DIRECTLY on
# every one of them (Avalanche 2026-08-12, Polygon 2026-08-24), the same way the sibling project probed Injective —
# eth_call against `cast call --create <opcode bytecode>`. One toml serves all four networks, so a chain that lacked
# these opcodes would have to be excluded rather than accommodated. All four opcodes we depend on executed:
#     PUSH0 0x5f  MCOPY 0x5e  TLOAD 0x5c  TSTORE 0x5d      -> OK on 43114, 43113, 137 AND 80002
# and the discriminator confirmed the probe can actually fail:
#     undefined opcode 0x21                                 -> "invalid opcode: opcode 0x21 not defined" on all four
# Reproduce with, e.g.:
#     cast call --rpc-url https://api.avax.network/ext/bc/C/rpc --create 0x6020600060005e60006000f3        # MCOPY
#     cast call --rpc-url https://api.avax-test.network/ext/bc/C/rpc --create 0x60005c5060006000f3         # TLOAD
#     cast call --rpc-url https://polygon-bor-rpc.publicnode.com --create 0x6020600060005e60006000f3       # MCOPY
#     cast call --rpc-url https://polygon-amoy-bor-rpc.publicnode.com --create 0x60005c5060006000f3        # TLOAD
#
# ⚠️ evm_version feeds type(BeaconProxy).creationCode, so changing it moves every predicted forwarder address and
#    permanently breaks createForwarder on any factory already live. See the golden vector in
#    test/UpgradeTransitFactory.t.sol and _assertFactoryUpgradeKeepsAddressSpace in script/BaseScript.sol.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# On for the stable release, matching the sibling project. Note the sibling's justification (byte-at-a-time loops in
# its memo hex-encoder) does NOT apply here — TransitForwarder has no such loop, and its only byte-walking code is the
# CCTPV2Message offset parser. The setting is kept anyway because it feeds type(BeaconProxy).creationCode: flipping it
# is free only while no factory is live, and matching the sibling keeps one golden vector valid for both.
via_ir = true

# ⚠️ FUNDS-CRITICAL, do not remove. solc embeds `settings.remappings` in the metadata blob appended to every
# contract's bytecode, so the remapping LIST feeds type(BeaconProxy).creationCode and therefore every predicted
# forwarder address. With auto-detection on, foundry derives extra remappings by scanning lib/, which means a
# nested dependency directory merely EXISTING on the build machine silently moves the address space — three
# different creationCode hashes were observed from one commit purely by varying which nested submodules were
# checked out. Pinning to remappings.txt makes the build reproducible from tracked files alone.
auto_detect_remappings = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
